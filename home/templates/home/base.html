<!DOCTYPE html>
{% load static %}
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--    <link rel="shortcut icon" href="{% static 'img/EventApp-icon.png' %}">-->
    <title>EventApp</title>

    <!-- Bootstrap -->
    <link href="{% static 'css/bootstrap.min.css'%}" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- Persian Font -->
<!--    <link rel="preconnect" href="https://fonts.googleapis.com">-->
<!--    <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;800&display=swap" rel="stylesheet">-->

</head>

<body>

    {% include 'home/navbar.html' %}

    <!-- Messages -->
    {% if messages %}
    <div class="container mt-3">
        {% for message in messages %}
            <div class="EventApp-message EventApp-message-{{ message.tags }} alert alert-dismissible fade show" dir="rtl">

                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"
                        aria-label="بستن">
                </button>
            </div>
        {% endfor %}
    </div>
    {% endif %}

    <!-- Page Content -->
    {% block content %}
    {% endblock %}

    <!-- ================= FOOTER ================= -->
    <footer class="EventApp-footer py-4 mt-5">

        <div class="container d-flex flex-column flex-md-row justify-content-between align-items-center">

            <!-- Social Icons -->
            <div class="footer-social d-flex gap-3">
                <a href="#" class="social-icon" aria-label="Instagram">
                    <i class="bi bi-instagram"></i>
                </a>

                <a href="#" class="social-icon" aria-label="Twitter">
                    <i class="bi bi-twitter"></i>
                </a>

                <a href="#" class="social-icon" aria-label="Facebook">
                    <i class="bi bi-facebook"></i>
                </a>
            </div>

        </div>

        <!-- Copyright -->
        <div class="text-center mt-3 footer-copy">
            © {{ now.year }} EventAppapp - تمامی حقوق محفوظ است
        </div>

        <div class="text-center mt-1 footer-powered">
            توسعه داده شده توسط مهدی نصیرسلطانی | ۰۹۹۱۱۳۲۷۷۵۱
        </div>

    </footer>

    <!-- Bootstrap JS -->
    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

<style>

:root {
    --orange-main: #FF6600;
    --orange-soft: #FF9751;
    --blue-dark: #22305C;
    --blue-accent: #136197;
}

/* ================= GLOBAL ================= */

html,
body {
    direction: rtl;
    text-align: right;
    font-family: 'Vazirmatn', sans-serif;
    background: #f7f8fc;
}

/* ================= MESSAGES ================= */

.EventApp-message {
    position: relative;
    padding: 0.6rem 1rem;

    margin-bottom: 1rem;
    border-radius: 22px;
    box-shadow: 0 12px 35px rgba(0,0,0,0.18);

    color: #fff;
    font-weight: 600;

    display: flex;
    align-items: center;
    justify-content: space-between;

    animation: slideIn 0.5s ease forwards;
}

.EventApp-message-success {
    background: linear-gradient(135deg, #136197, #22305C);
}

.EventApp-message-error {
    background: linear-gradient(135deg, #FF6600, #FF9751);
}

.EventApp-message-warning {
    background: linear-gradient(135deg, #FF9751, #FF6600);
    color: #22305C;
}

.EventApp-message-info {
    background: linear-gradient(135deg, #22305C, #136197);
}

.EventApp-message .btn-close {

    position: static !important;

    margin-right: 1rem;
    margin-left: 0;

    background-color: rgba(255,255,255,0.2);

    border: none;
    border-radius: 50%;

    width: 14px;
    height: 14px;
    padding: 0.2rem;
    background-size: 8px;


    opacity: 0.6;

    display: flex;
    align-items: center;
    justify-content: center;

    transition: all 0.3s ease;

    filter: invert(1);
}


.EventApp-message .btn-close:hover {
    background: rgba(255,255,255,0.4);
    opacity: 1;
}

/* ================= ANIMATION ================= */

@keyframes slideIn {

    0% {
        transform: translateY(-20px);
        opacity: 0;
    }

    100% {
        transform: translateY(0);
        opacity: 1;
    }
}

/* ================= FOOTER ================= */

.EventApp-footer {

    background: #22305C;
    color: #fff;

    font-weight: 500;

    border-top: 1px solid rgba(255,255,255,0.1);

    direction: rtl;
    text-align: center;
}

.EventApp-footer a {

    color: #FF9751;
    text-decoration: none;

    transition: color 0.3s ease;
}

.EventApp-footer a:hover {
    color: #FF6600;
}

.footer-logo {

    font-size: 1.4rem;
    font-weight: 800;

    color: #FF6600;
}

.footer-tagline {

    font-size: 0.9rem;
    color: #fff;

    opacity: 0.8;
}

.footer-social a {

    font-size: 1.2rem;
    color: #FF9751;

    transition:
        transform 0.25s ease,
        color 0.25s ease;
}

.footer-social a:hover {

    color: #FF6600;
    transform: translateY(-3px);
}

.footer-copy {

    color: #aaa;
    font-size: 0.85rem;
}

.footer-powered {

    color: rgba(255,255,255,0.45);
    font-size: 0.75rem;
}


/* ================= MOBILE ================= */

@media (max-width: 767px) {

    .EventApp-footer .container {

        flex-direction: column;
        gap: 1rem;

        text-align: center;
    }
}

</style>
<script>
setTimeout(() => {
  document.querySelectorAll('.EventApp-message').forEach(msg => {
    msg.style.opacity = '0';
    setTimeout(() => msg.remove(), 500);
  });
}, 4000);
</script>

</body>
</html>
