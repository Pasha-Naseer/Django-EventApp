{% extends 'home/base.html' %}
{% load static %}

{% block content %}

<section class="container py-5" dir="rtl">

    <div class="event-card">

        <div class="mb-4">
            <h2 class="event-title">ایجاد رویداد</h2>
            <p class="event-subtitle">
                اطلاعات رویداد جدید را وارد کنید
            </p>
        </div>

        <form method="post"
              action="{% url 'home:create_event' category.id %}"
              enctype="multipart/form-data">

            {% csrf_token %}

            <div class="mb-4">
                <label class="custom-label">
                    {{ form.name.label }}
                </label>

                {{ form.name }}
            </div>

            <div class="mb-4">
                <label class="custom-label">
                    {{ form.image.label }}
                </label>

                {{ form.image }}
            </div>

            <div class="mb-4">
                <label class="custom-label">
                    {{ form.description.label }}
                </label>

                {{ form.description }}
            </div>

            <div class="row">

                <div class="col-md-6 mb-4">
                    <label class="custom-label">
                        {{ form.event_date.label }}
                    </label>

                    {{ form.event_date }}
                </div>

                <div class="col-md-3 mb-4">
                    <label class="custom-label">
                        {{ form.start_hour.label }}
                    </label>

                    {{ form.start_hour }}
                </div>

                <div class="col-md-3 mb-4">
                    <label class="custom-label">
                        {{ form.end_hour.label }}
                    </label>

                    {{ form.end_hour }}
                </div>

            </div>

            <div class="mb-4">
                <label class="custom-label">
                    {{ form.privacy.label }}
                </label>

                {{ form.privacy }}
            </div>

            <button type="submit" class="create-btn">
                ایجاد رویداد
            </button>

        </form>

    </div>

</section>

<style>

/* ===== CARD ===== */

.event-card {

    max-width: 760px;

    margin: auto;

    padding: 2.5rem;

    border-radius: 28px;

    background:
        linear-gradient(
            135deg,
            rgba(19,97,151,0.06),
            rgba(34,48,92,0.08)
        );

    box-shadow:
        0 20px 45px rgba(0,0,0,0.12);

    border:
        1px solid rgba(255,255,255,0.3);

    backdrop-filter: blur(8px);
}

/* ===== TITLES ===== */

.event-title {

    color: #22305C;

    font-size: 2rem;

    font-weight: 800;

    margin-bottom: 0.5rem;
}

.event-subtitle {

    color: #666;

    margin: 0;
}

/* ===== LABELS ===== */

.custom-label {

    display: block;

    margin-bottom: 0.7rem;

    color: #22305C;

    font-weight: 700;

    font-size: 0.95rem;
}

/* ===== INPUTS ===== */

.form-control,
.form-select {

    border-radius: 16px !important;

    border: 1px solid rgba(0,0,0,0.1);

    padding: 0.9rem 1rem;

    font-size: 1rem;

    background-color: rgba(255,255,255,0.95);

    transition: all 0.25s ease;

    direction: rtl;

    text-align: right;
}

/* ===== TEXTAREA ===== */

textarea.form-control {

    min-height: 140px;

    resize: vertical;
}

/* ===== FOCUS ===== */

.form-control:focus,
.form-select:focus {

    border-color: #136197;

    box-shadow:
        0 0 0 0.2rem rgba(19,97,151,0.15);

    background-color: #fff;
}

/* ===== FILE INPUT ===== */

input[type="file"] {

    padding: 0.75rem;
}

/* ===== TIME/DATE ===== */

input[type="date"],
input[type="time"] {

    cursor: pointer;
}

/* ===== BUTTON ===== */

.create-btn {

    border: none;

    padding: 0.9rem 2.2rem;

    border-radius: 999px;

    font-weight: 800;

    font-size: 1rem;

    color: white;

    background:
        linear-gradient(
            135deg,
            #FF6600,
            #FF9751
        );

    box-shadow:
        0 12px 28px rgba(255,102,0,0.35);

    transition: all 0.25s ease;
}

.create-btn:hover {

    transform: translateY(-2px);

    box-shadow:
        0 18px 36px rgba(255,102,0,0.45);
}

/* ===== MOBILE ===== */

@media (max-width: 768px) {

    .event-card {

        padding: 1.5rem;
    }

    .event-title {

        font-size: 1.6rem;
    }
}
.form-select {

    direction: rtl;

    text-align: right;

    padding-right: 0.6rem;

    padding-left: 2.2rem;

    text-indent: 20px;
}

</style>


<!-- Persian Datepicker CSS -->
<link rel="stylesheet" href="{% static 'css/persian-datepicker.min.css' %}">

<!-- Persian Date Library -->
<script src="{% static 'js/persian-date.min.js' %}"></script>

<!-- jQuery (required for Persian Datepicker) -->
<script src="{% static 'js/jquery-3.6.0.min.js' %}"></script>

<!-- Persian Datepicker JS -->
<script src="{% static 'js/persian-datepicker.min.js' %}"></script>


<script>
$(document).ready(function() {
    // Change the input type from 'date' to 'text' and disable autocomplete
    $('#id_event_date').attr('type', 'text').attr('autocomplete', 'off');

    // Initialize Persian Datepicker on the event_date field
    $('#id_event_date').persianDatepicker({
        format: 'YYYY-MM-DD',
        initialValue: false,
        autoClose: true,
        calendar: {
            persian: {
                locale: 'fa'
            }
        },
        navigator: {
            enabled: true,
            scroll: {
                enabled: true
            },
            text: {
                btnNextText: '<',
                btnPrevText: '>'
            }
        },
        toolbox: {
            enabled: true,
            calendarSwitch: {
                enabled: false
            },
            todayButton: {
                enabled: true,
                text: {
                    fa: 'امروز'
                }
            },
            submitButton: {
                enabled: true,
                text: {
                    fa: 'تایید'
                }
            }
        },
        timePicker: {
            enabled: false
        },
        dayPicker: {
            enabled: true
        },
        monthPicker: {
            enabled: true
        },
        yearPicker: {
            enabled: true
        }
    });
});

$(document).ready(function() {
    $("#persian-datepicker").persianDatepicker({
        format: 'YYYY/MM/DD',
        initialValue: false,
        autoClose: true,
        calendar: {
            persian: {
                locale: 'fa'
            }
        }
    });
});
</script>



{% endblock %}
