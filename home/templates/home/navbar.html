{% load static %}

<nav class="EventApp-navbar" dir="rtl">
  <div class="nav-container">

    <!-- LINKS -->
    <div class="nav-links">
      <a href="{% url 'home:home' %}" class="nav-link {% if request.resolver_match.url_name == 'home' %}active{% endif %}">
        خانه
      </a>

      <a href="{% url 'flowaccounts:explore' %}" class="nav-link {% if request.resolver_match.url_name == 'explore' %}active{% endif %}">
        جستجو
      </a>

      <a href="{% url 'home:notifications' %}" class="nav-link {% if request.resolver_match.url_name == 'notifications' %}active{% endif %}">
        اعلان‌ها
      </a>

      {% if request.user.profile %}
        <a href="{% url 'flowaccounts:my_profile' %}" class="nav-link {% if request.resolver_match.url_name == 'my_profile' %}active{% endif %}">
          پروفایل من
        </a>
      {% endif %}

      <a href="{% url 'flowaccounts:contact-us' %}" class="nav-link {% if request.resolver_match.url_name == 'contact-us' %}active{% endif %}">
        ارتباط با ما
      </a>

      {% if request.user.is_authenticated %}
        <a href="{% url 'flowaccounts:logout' %}" class="nav-link danger">
          خروج
        </a>
      {% else %}
        <a href="{% url 'flowaccounts:register' %}" class="nav-link {% if request.resolver_match.url_name == 'register' %}active{% endif %}">
          ثبت‌نام
        </a>
        <a href="{% url 'flowaccounts:login' %}" class="nav-btn {% if request.resolver_match.url_name == 'login' %}active-btn{% endif %}">
          ورود
        </a>
      {% endif %}
    </div>

  </div>
</nav>

<style>
    :root {
  --orange-main: #FF6600;
  --orange-soft: #FF9751;
  --blue-dark: #22305C;
  --blue-accent: #136197;
}

/* ===== NAVBAR ===== */
.EventApp-navbar {
  position: sticky;
  top: 0;
  z-index: 1000;
  background: rgba(34, 48, 92, 0.85);
  backdrop-filter: blur(14px);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.nav-container {
  max-width: 1200px;
  margin: auto;
  padding: 0.8rem 1.2rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

/* BRAND */
.nav-brand {
  font-size: 1.6rem;
  font-weight: 800;
  letter-spacing: 1px;
  color: var(--orange-main);
  text-decoration: none;
}

/* LINKS */
.nav-links {
  display: flex;
  align-items: center;
  gap: 1.4rem;
}

.nav-link {
  color: #fff;
  font-weight: 500;
  text-decoration: none;
  opacity: 0.85;
  transition: all 0.25s ease;
}

.nav-link:hover {
  opacity: 1;
  color: var(--orange-soft);
}

/* ACTIVE PAGE */
.nav-link.active {
  color: var(--orange-main);
  opacity: 1;
  font-weight: 700;
}

/* LOGOUT */
.nav-link.danger {
  color: red;
}

/* LOGIN BUTTON */
.nav-btn {
  padding: 0.45rem 1.1rem;
  border-radius: 999px;
  background: linear-gradient(
    135deg,
    var(--orange-main),
    var(--orange-soft)
  );
  color: #fff;
  font-weight: 700;
  text-decoration: none;
  box-shadow: 0 6px 20px rgba(255,102,0,0.4);
  transition: all 0.3s ease;
}

.nav-btn:hover {
  transform: translateY(-2px);
  box-shadow: 0 10px 30px rgba(255,102,0,0.6);
}

.nav-btn.active-btn {
  box-shadow: 0 10px 30px rgba(255,102,0,0.6);
}

/* MOBILE */
@media (max-width: 768px) {
  .nav-links {
    gap: 0.9rem;
  }

  .nav-brand {
    font-size: 1.3rem;
  }
}

</style>
